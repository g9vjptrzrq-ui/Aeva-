name: Build Aeva iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Aeva
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Find Aeva project
        run: |
          echo "=== PROJECT ==="
          find . -name "Aeva.xcodeproj" -print
          echo "=== FILES ==="
          find . -maxdepth 3 -type f | sort

      - name: List schemes
        run: |
          xcodebuild \
            -project "./Aeva.xcodeproj" \
            -list

      - name: Build
        run: |
          set -euxo pipefail

          rm -rf build

          xcodebuild \
            -project "./Aeva.xcodeproj" \
            -scheme "Aeva" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Find Aeva.app
        run: |
          echo "=== BUILT APP ==="
          find "$PWD/build" -name "Aeva.app" -type d -print

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Aeva-iOS
          path: build/Build/Products/Release-iphoneos/Aeva.app
