workflows:
ios-aeva:
name: Aeva iOS Build
max_build_duration: 60
instance_type: mac_mini_m2
environment:
xcode: latest
vars:
XCODE_PROJECT: "Aeva/Aeva.xcodeproj"
XCODE_SCHEME: "Aeva"
scripts:
- name: Build Aeva (unsigned)
script: |
xcodebuild \
-project "$XCODE_PROJECT" \
-scheme "$XCODE_SCHEME" \
-configuration Debug \
-destination 'generic/platform=iOS' \
CODE_SIGNING_ALLOWED=NO \
CODE_SIGNING_REQUIRED=NO \
CODE_SIGN_IDENTITY="" \
build
artifacts:
- build/Build/Products/Debug-iphoneos/*.app
