name: Aeva
options:
  bundleIdPrefix: com.aeva
  deploymentTarget:
    iOS: "16.2"
  developmentLanguage: en
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.2"
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Aeva:
    type: application
    platform: iOS
    sources:
      - path: Sources/Aeva
        excludes:
          - Info.plist
    resources:
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeva.app
        PRODUCT_NAME: Aeva
        INFOPLIST_FILE: Sources/Aeva/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_LIVE_ACTIVITIES: YES
    dependencies:
      - target: AevaWidget
        embed: true

  AevaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/AevaWidget
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeva.app.widget
        PRODUCT_NAME: AevaWidget
        INFOPLIST_FILE: Sources/AevaWidget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SUPPORTS_LIVE_ACTIVITIES: YES
    scheme: {}

schemes:
  Aeva:
    build:
      targets:
        Aeva: all
        AevaWidget: all
    run:
      config: Debug
    archive:
      config: Release
